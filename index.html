<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server's Output</title>
    <link rel="stylesheet" href="messagestyles.css">
</head>

<body style="background-color: #a0ffdf;">
    <div id="navbar">
        <input id="msgbox" type="text" name="message">
        <input  onclick="sendJSON()" type="submit" id="">
        </div>
    

    <div id="postArea"></div>
</body>
<script>
async function getMessage() {
    const url = "https://sparkling-dedication-production-636d40b2.up.railway.app/fetch/";
    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error('Response status: ${response.status}');
        } const result = await response.json();
        var md = result.message
        var myarray = md.split("<br>")
        document.getElementById("postArea").innerHTML = ""
        myarray.forEach(element => {
            document.getElementById("postArea").innerHTML += "<p>" + element + "</p>"
        })

    }

    catch (error) {
        console.error(error.message);
    }

}



function sendJSON() {
    var message = document.getElementById("msgbox").value
    fetch('http://172.16.11.161:8080/send/', {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },

        body: JSON.stringify({
            "Title": "string",
            "Message": message


        })
    })


}

setInterval(getMessage, 1000)</script>
</html>
